# k8s/api-gateway/kong-routes.yaml
apiVersion: configuration.konghq.com/v1
kind: KongIngress
metadata:
  name: subscription-versioning
route:
  methods: [GET, POST]
  paths:
    - /v1/subscriptions
    - /v2/subscriptions  
    - /v3/subscriptions
  strip_path: false
  preserve_host: true

---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: api-version-extractor
config:
  header_name: api-version
  query_param: version
  default_version: v2
plugin: request-transformer